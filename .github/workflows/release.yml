name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.4.2"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  actions: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  validate:
    name: validate release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Validate tag and version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          git fetch origin main --prune
          main_sha="$(git rev-parse FETCH_HEAD)"
          tag_sha="$(git rev-list -n 1 "$RELEASE_TAG" 2>/dev/null || true)"
          if [[ -z "$tag_sha" ]]; then
            tag_sha="$GITHUB_SHA"
          fi
          if ! git merge-base --is-ancestor "$tag_sha" "$main_sha"; then
            echo "$RELEASE_TAG does not point to a commit reachable from main." >&2
            exit 1
          fi
          ./scripts/check-release-version.sh "$RELEASE_TAG"

  build-linux:
    name: build Linux release assets
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install cross-build dependencies
        run: |
          rustup toolchain install --profile minimal
          rustup target add x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin
          cargo install cargo-zigbuild --locked
          curl -fsSL https://ziglang.org/download/0.15.0/zig-x86_64-linux-0.15.0.tar.xz \
            -o "$RUNNER_TEMP/zig.tar.xz"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.15.0" >> "$GITHUB_PATH"
      - name: Build all release assets
        run: |
          ./build.sh linux-x86_64 linux-aarch64
          test "$(ls release/enva-* | wc -l)" -eq 2
      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: linux-assets
          path: release/
          if-no-files-found: error

  build-macos:
    name: build macOS release asset
    needs: validate
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust
        run: rustup toolchain install --profile minimal
      - name: Build macOS asset
        run: |
          ./build.sh macos-aarch64
          test -f release/enva-macos-aarch64
      - name: Upload macOS asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macos-assets
          path: release/
          if-no-files-found: error

  macos-e2e:
    name: macOS release e2e
    needs: [build-linux, build-macos]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Download Linux release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: linux-assets
          path: release
      - name: Download macOS release asset
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: macos-assets
          path: release
      - name: Run macOS end-to-end suite
        run: |
          chmod +x release/enva-macos-aarch64
          ./scripts/test-macos.sh release/enva-macos-aarch64
      - name: Generate combined checksums
        working-directory: release
        run: |
          # Both build jobs land here, so the manifest can only be complete once
          # every platform asset is present. Names stay bare for `shasum -c`.
          shasum -a 256 enva-* > SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 3
          shasum -a 256 -c SHA256SUMS
          cat SHA256SUMS
      - name: Upload tested release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-assets
          path: release/
          if-no-files-found: error

  publish-release:
    name: publish GitHub release
    needs: macos-e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-assets
          path: release
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Enva $RELEASE_TAG" \
              --generate-notes
          fi

  npm-publish:
    name: publish npm packages
    needs: publish-release
    runs-on: ubuntu-latest
    steps:
      # npm's trusted publishing validates the *calling* workflow, so invoking
      # npm-publish.yml through `workflow_call` presents release.yml as the
      # OIDC subject and the registry rejects it with ENEEDAUTH. Dispatching it
      # as a top-level run makes npm-publish.yml its own subject, which is what
      # the configured trusted publisher expects. A package can only name one
      # publisher, and the same entry has to keep serving manual re-dispatch.
      - name: Dispatch npm publish and wait for it
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # The dispatch API does not return the run it created, so the run
          # advertises this id in its name and we match on that. Matching by
          # timestamp alone would let a concurrent publish be watched instead.
          correlation="release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh workflow run npm-publish.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f tag="$RELEASE_TAG" \
            -f correlation_id="$correlation"

          run_id=""
          for _ in $(seq 1 30); do
            sleep 5
            run_id="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow npm-publish.yml \
              --event workflow_dispatch \
              --limit 50 \
              --json databaseId,displayTitle \
              --jq "[.[] | select(.displayTitle | contains(\"[$correlation]\"))] | .[0].databaseId // empty")"
            [[ -n "$run_id" ]] && break
          done
          if [[ -z "$run_id" ]]; then
            echo "npm-publish.yml was dispatched but no run advertised $correlation." >&2
            exit 1
          fi

          echo "Watching https://github.com/$GITHUB_REPOSITORY/actions/runs/$run_id"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
