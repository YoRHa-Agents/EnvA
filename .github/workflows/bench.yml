name: Benchmarks

on:
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install Rust
        run: rustup toolchain install --profile minimal
      - name: Run benchmarks
        run: |
          mkdir -p target/benchmark-evidence
          {
            date -u
            rustc --version --verbose
            cargo --version
          } > target/benchmark-evidence/environment.txt
          cargo bench --workspace
      - name: Store benchmark evidence
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: benchmark-${{ github.run_id }}
          path: |
            target/criterion/
            target/benchmark-evidence/
          if-no-files-found: error
