name: Benchmarks

on:
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust
        run: rustup toolchain install --profile minimal
      - name: Run benchmarks
        run: |
          mkdir -p target/benchmark-evidence
          {
            date -u
            rustc --version --verbose
            cargo --version
          } > target/benchmark-evidence/environment.txt
          cargo bench --workspace
      - name: Store benchmark evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: benchmark-${{ github.run_id }}
          path: |
            target/criterion/
            target/benchmark-evidence/
          if-no-files-found: error
