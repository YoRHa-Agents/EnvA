name: Fuzzing

on:
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz --locked
      - name: Fuzz vault JSON
        working-directory: fuzz
        run: cargo +nightly fuzz run vault_json -- -max_total_time=600
      - name: Fuzz import formats
        working-directory: fuzz
        run: cargo +nightly fuzz run import_formats -- -max_total_time=600
      - name: Fuzz key material
        working-directory: fuzz
        run: cargo +nightly fuzz run key_material -- -max_total_time=600
      - name: Upload fuzz evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fuzz-${{ github.run_id }}
          path: fuzz/artifacts/
          if-no-files-found: warn
