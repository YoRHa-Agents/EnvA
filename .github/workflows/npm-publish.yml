name: Publish npm packages

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing GitHub Release tag, for example v1.4.2"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Download GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'enva-*' \
            --dir "$RUNNER_TEMP/release" \
            --clobber
      - name: Prepare npm packages
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          ./scripts/prepare-npm-packages.sh \
            "${RELEASE_TAG#v}" \
            "$RUNNER_TEMP/release" \
            "$RUNNER_TEMP/npm"
      - name: Publish platform packages with provenance
        working-directory: ${{ runner.temp }}/npm
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          publish_if_missing() {
            local package="$1"
            local name
            name="$(node -p "require('./$package/package.json').name")"
            if npm view "$name@$version" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
              echo "$name@$version already published; skipping."
            else
              npm publish "./$package" --provenance --access public
            fi
          }
          publish_if_missing enva-linux-x64
          publish_if_missing enva-linux-arm64
          publish_if_missing enva-darwin-arm64
      - name: Publish main package with provenance
        working-directory: ${{ runner.temp }}/npm
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          if npm view "@yorha-agents/enva@$version" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "@yorha-agents/enva@$version already published; skipping."
          else
            npm publish ./enva --provenance --access public
          fi
