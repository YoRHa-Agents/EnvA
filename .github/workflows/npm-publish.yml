name: Publish npm packages

# Deliberately dispatch-only. npm's trusted publishing validates the calling
# workflow, so exposing workflow_call here lets a caller publish under its own
# identity and the registry rejects it. release.yml dispatches this workflow
# instead of calling it.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing GitHub Release tag, for example v1.4.2"
        required: true
        type: string
      correlation_id:
        description: "Set by release.yml so it can identify this run; leave empty when dispatching by hand"
        required: false
        type: string

run-name: >-
  npm publish ${{ inputs.tag }}${{ inputs.correlation_id && format(' [{0}]',
  inputs.correlation_id) || '' }}

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Node with an OIDC-capable npm
        # Trusted publishing needs npm >= 11.5.1; the runner image ships npm 10,
        # which silently falls back to token auth and fails with ENEEDAUTH.
        # registry-url is deliberately omitted: it writes an .npmrc _authToken
        # placeholder that makes npm take the token path and skip OIDC entirely.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Verify npm can use trusted publishing
        run: |
          npm_version="$(npm --version)"
          echo "npm $npm_version"
          if [[ "$(printf '%s\n11.5.1\n' "$npm_version" | sort -V | head -1)" != "11.5.1" ]]; then
            echo "npm $npm_version cannot use trusted publishing; need >= 11.5.1." >&2
            exit 1
          fi
          if [[ -n "${NPM_CONFIG_USERCONFIG:-}" ]] \
            && grep -q '_authToken' "$NPM_CONFIG_USERCONFIG" 2>/dev/null; then
            echo "An .npmrc _authToken entry is present; npm would skip OIDC." >&2
            exit 1
          fi
      - name: Download GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'enva-*' \
            --dir "$RUNNER_TEMP/release" \
            --clobber
      - name: Prepare npm packages
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          ./scripts/prepare-npm-packages.sh \
            "${RELEASE_TAG#v}" \
            "$RUNNER_TEMP/release" \
            "$RUNNER_TEMP/npm"
      - name: Publish platform packages with provenance
        working-directory: ${{ runner.temp }}/npm
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          publish_if_missing() {
            local package="$1"
            local name
            name="$(node -p "require('./$package/package.json').name")"
            if npm view "$name@$version" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
              echo "$name@$version already published; skipping."
            else
              npm publish "./$package" --provenance --access public
            fi
          }
          publish_if_missing enva-linux-x64
          publish_if_missing enva-linux-arm64
          publish_if_missing enva-darwin-arm64
      - name: Publish main package with provenance
        working-directory: ${{ runner.temp }}/npm
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          if npm view "@yorha-agents/enva@$version" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "@yorha-agents/enva@$version already published; skipping."
          else
            npm publish ./enva --provenance --access public
          fi
